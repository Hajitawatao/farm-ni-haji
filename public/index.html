<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm Ni Haji Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234f9d58'/%3E%3Ctext x='50' y='64' font-size='34' font-family='sans-serif' font-weight='900' fill='%23fff' text-anchor='middle'%3EFNH%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:'Nunito';font-weight:600;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:900;font-display:swap;src:url(fonts/nunito-latin-900-normal.woff2) format('woff2')}
:root{--card:rgba(255,251,243,0.94);--ink:#2a2420;--muted:#6b5a48;--soft:#8a7a68;--chip:#efe6d6;--chipH:#e4d8c3;--tile:#f3ebdd;--shadow:0 8px 30px rgba(40,30,20,0.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#bcd9e6;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:#2f6f4e}a:hover{color:#1d4a33}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#stage{position:fixed;inset:0;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-9999px,0);display:flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;border-radius:999px;background:rgba(255,251,243,0.95);box-shadow:0 2px 10px rgba(40,30,20,0.25);font-size:14px;font-weight:800;white-space:nowrap;pointer-events:auto;cursor:pointer}
.lbl .dot{width:10px;height:10px;border-radius:50%;flex:none}
.lbl .tag{font-weight:900;font-size:12px}
.lbl.sel{outline:3px solid var(--ink)}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
#top{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;pointer-events:none}
#top>*{pointer-events:auto}
#brand{padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:210px;max-width:330px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--muted)}
#clock{font-size:32px;font-weight:900;line-height:1.05}
#date{font-size:13px;font-weight:700;color:var(--muted)}
#src{display:flex;align-items:flex-start;gap:7px;margin-top:6px;font-size:12px;font-weight:800;color:#4a3f35}
#src i{width:8px;height:8px;margin-top:4px;border-radius:50%;flex:none}
#right{display:flex;flex-direction:column;gap:10px;align-items:flex-end;margin-left:auto}
#counts{padding:12px 14px;display:flex;gap:6px}
.cnt{display:flex;flex-direction:column;align-items:center;min-width:62px;padding:2px 6px}
.cnt b{font-size:28px;font-weight:900;line-height:1.1}
.cnt span{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
#btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:13px;font-weight:800;padding:8px 14px;border-radius:999px;white-space:nowrap;background:var(--card);box-shadow:0 4px 14px rgba(40,30,20,0.14)}
.pill:hover{background:#fff}
#banner{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100vw - 32px);color:#fff;border-radius:999px;padding:12px 22px;font-weight:900;font-size:18px;box-shadow:0 8px 30px rgba(160,40,30,0.35);display:none;align-items:center;gap:10px}
#banner i{width:12px;height:12px;border-radius:50%;background:#fff;flex:none}
#banner span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel{position:fixed;right:16px;top:200px;bottom:16px;width:350px;max-width:calc(100vw - 32px);display:none;flex-direction:column;pointer-events:none}
#panel .card{pointer-events:auto;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow-y:auto}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph h2{margin:2px 0;font-size:21px;font-weight:900;line-height:1.15}
.ph p{margin:0;font-size:14px;font-weight:600;color:#5a4c3f}
.x{flex:none;width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:900;background:var(--chip)}
.x:hover{background:var(--chipH)}
.badge{align-self:flex-start;padding:6px 12px;border-radius:999px;color:#fff;font-weight:900;font-size:14px}
.err{background:#fbe3df;color:#8f2a1f;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--tile);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:1px}
.tile span,.sec{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.tile b{font-size:17px;font-weight:900}
.spark{display:flex;align-items:flex-end;gap:2px;height:46px;background:var(--tile);border-radius:12px;padding:6px 8px}
.spark i{flex:1;min-width:2px;border-radius:2px 2px 0 0}
.row{display:flex;gap:10px;font-size:13px;font-weight:700}
.row .t{color:var(--soft);flex:none}
.muted{font-size:13px;font-weight:700;color:var(--soft)}
#inc{position:fixed;left:16px;bottom:16px;width:400px;max-width:calc(100vw - 32px);max-height:45vh;overflow-y:auto;border-radius:20px;padding:16px 18px;display:none;flex-direction:column;gap:8px}
#inc .ph{align-items:center}
.small{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--chip)}
.small:hover{background:var(--chipH)}
.irow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:13px;font-weight:700}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#msg div{padding:14px 22px;font-weight:800;max-width:440px;text-align:center}
@media (max-width:640px){#panel{top:auto;height:60vh}#brand{max-width:none}.cnt{min-width:48px}.cnt b{font-size:22px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<div id="top">
  <div id="brand" class="card">
    <div class="eyebrow">FARM NI HAJI</div>
    <div id="clock">--:--</div>
    <div id="date"></div>
    <div id="src"><i></i><span></span></div>
  </div>
  <div id="right">
    <div id="counts" class="card"></div>
    <div id="btns">
      <button class="pill" id="bAlerts">Enable alerts</button>
      <button class="pill" id="bInc">Incidents</button>
      <button class="pill" id="bReset">Reset view</button>
    </div>
  </div>
</div>

<div id="banner"><i></i><span></span></div>
<div id="panel"><div class="card" id="panelBody"></div></div>
<div id="inc" class="card"></div>
<div id="msg"><div class="card">Building the farm…</div></div>

<script type="module">
import * as THREE from './vendor/three.module.js';

const COL = { up: '#4f9d58', slow: '#e0a030', down: '#d9493b', maint: '#7d8ca8', nourl: '#9a9a8e', wait: '#8fa3ad' };
const SPECIES = { horse: 'HORSE', cow: 'COW', goat: 'GOAT', pig: 'PIG', sheep: 'SHEEP', duck: 'DUCK', chicken: 'ROOSTER', rabbit: 'RABBIT', hen: 'HEN' };
const POLL_MS = 4000;
const SOUND = true;              // set false to silence the siren
const AUTO_SWAY = true;          // camera drifts back to the overview when idle
const params = new URLSearchParams(location.search);
const TIME_MODE = params.get('time') || 'auto';          // ?time=day or ?time=night
const QUALITY = params.get('quality') || 'high';         // ?quality=low for weak PCs / TVs

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = t => { const d = new Date(t); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); };
const fmtDur = ms => { const s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24); return d ? `${d}d ${h % 24}h` : h ? `${h}h ${m % 60}m` : m ? `${m}m` : `${s}s`; };
const sleepy = st => st === 'maint' || st === 'nourl';

class Farm {
  constructor() {
    this.sys = []; this.incidents = []; this.meta = {};
    this.ui = { sel: null, showInc: false, alertsOn: false };
    this.link = { ok: null, lastOk: 0, fails: 0 };
    this.cs = { yaw: 0, pitch: 0.62, zoom: 1, tx: 0, tz: -1.5 };
    this.cur = { yaw: 0, pitch: 0.62, zoom: 1, tx: 0, tz: -1.5 };
    this.idle = 0; this.prev = {}; this.labelEls = {}; this.animals = {}; this.speciesKey = '';
    try { this.ui.alertsOn = localStorage.getItem('farm.alerts') === '1'; } catch (e) {}
    this.wireButtons();
    this.initScene();
    this.poll();
    setInterval(() => this.renderClock(), 1000);
    setInterval(() => { if (this.hasDown()) this.renderBanner(); }, 600);
  }

  // ================= DATA FROM SERVER =================
  async poll() {
    try {
      const r = await fetch('api/status', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      this.meta = { server: d.server, every: d.checkEverySeconds, slowMs: d.slowMs };
      this.incidents = d.incidents || [];
      this.applySystems(d.systems || []);
      this.link = { ok: true, lastOk: Date.now(), fails: 0 };
    } catch (e) {
      this.link.fails++;
      if (this.link.fails >= 2) {
        if (this.link.ok !== false && this.ui.alertsOn && SOUND) this.beep(true);
        this.link.ok = false;
      }
    }
    this.renderUI();
    setTimeout(() => this.poll(), POLL_MS);
  }
  applySystems(list) {
    list.forEach(s => {
      const p = this.prev[s.id];
      if (p && p !== s.status) this.alert(s, p);
      this.prev[s.id] = s.status;
    });
    this.sys = list;
    const key = list.map(s => s.id + ':' + s.species).join('|');
    if (key !== this.speciesKey && this.T) { this.speciesKey = key; this.buildAnimals(); this.buildLabels(); }
    if (this.signCtx) this.drawSign();
  }
  alert(s, prev) {
    const down = s.status === 'down';
    if (!down && !(prev === 'down' && s.status === 'up')) return;
    if (this.ui.alertsOn && SOUND) this.beep(down);
    try { if (window.Notification && Notification.permission === 'granted') new Notification(down ? `${s.short} is down` : `${s.short} is back online`, { body: s.error || s.url, tag: s.id }); } catch (e) {}
  }
  summary() {
    const c = { up: 0, slow: 0, down: 0, sleep: 0, wait: 0 };
    this.sys.forEach(s => { if (sleepy(s.status)) c.sleep++; else c[s.status] = (c[s.status] || 0) + 1; });
    return c;
  }
  hasDown() { return this.link.ok === false || this.sys.some(s => s.status === 'down'); }

  // ================= SOUND =================
  unlockAudio() { try { const ac = this.ac || (this.ac = new (window.AudioContext || window.webkitAudioContext)()); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
  beep(down) {
    try {
      this.unlockAudio(); const ac = this.ac;
      (down ? [880, 587, 880, 587, 880, 587] : [523, 659, 784]).forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * 0.2;
        o.type = down ? 'sawtooth' : 'triangle'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        o.start(t); o.stop(t + 0.19);
      });
    } catch (e) {}
  }

  // ================= UI =================
  wireButtons() {
    $('bAlerts').onclick = async () => {
      this.unlockAudio(); this.beep(false);
      try { if (window.Notification && window.isSecureContext && Notification.permission !== 'granted') await Notification.requestPermission(); } catch (e) {}
      this.ui.alertsOn = true; try { localStorage.setItem('farm.alerts', '1'); } catch (e) {}
      this.renderUI();
    };
    $('bInc').onclick = () => { this.ui.showInc = !this.ui.showInc; this.renderUI(); };
    $('bReset').onclick = () => { Object.assign(this.cs, { yaw: 0, pitch: 0.62, zoom: 1, tx: 0, tz: -1.5 }); this.select(null); };
    // browsers block sound until the page is touched once
    window.addEventListener('pointerdown', () => this.unlockAudio(), { once: true });
  }
  renderClock() {
    const now = new Date();
    $('clock').textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    $('date').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) + (this.meta.server?.ip ? ' · ' + this.meta.server.ip : '');
    if (this.ui.sel) this.renderPanel();
  }
  renderUI() {
    this.renderClock();
    const src = $('src');
    if (this.link.ok === false) { src.querySelector('i').style.background = COL.down; src.querySelector('span').textContent = `Lost contact with the monitor server. Last update ${this.link.lastOk ? fmtTime(this.link.lastOk) : 'never'}.`; }
    else if (this.link.ok) { src.querySelector('i').style.background = COL.up; src.querySelector('span').textContent = `Live · ${this.sys.length} systems checked every ${this.meta.every}s by the server`; }
    else { src.querySelector('i').style.background = COL.wait; src.querySelector('span').textContent = 'Connecting to the monitor server…'; }

    const sm = this.summary();
    $('counts').innerHTML = [['ONLINE', sm.up, COL.up], ['SICK', sm.slow, COL.slow], ['DOWN', sm.down, COL.down], ['ASLEEP', sm.sleep, COL.maint]]
      .map(([l, n, c]) => `<div class="cnt"><b style="color:${c}">${n}</b><span>${l}</span></div>`).join('');
    $('bAlerts').textContent = this.ui.alertsOn ? 'Alerts on' : 'Enable alerts';
    $('bInc').textContent = `Incidents (${this.incidents.length})`;

    this.sys.forEach(s => {
      const el = this.labelEls[s.id]; if (!el) return;
      el.querySelector('.dot').style.background = COL[s.status];
      const tag = el.querySelector('.tag'); tag.style.color = COL[s.status];
      tag.textContent = s.status === 'down' ? 'DOWN' : s.status === 'slow' ? 'SLOW ' + s.latency + ' ms' : sleepy(s.status) ? 'z z' : s.status === 'wait' ? '…' : s.latency != null ? s.latency + ' ms' : '';
      el.classList.toggle('sel', this.ui.sel === s.id);
    });
    this.renderBanner(); this.renderPanel(); this.renderIncidents();
  }
  renderBanner() {
    const b = $('banner'), downs = this.sys.filter(s => s.status === 'down');
    let text = '';
    if (this.link.ok === false) text = 'Monitor server unreachable — statuses below are stale';
    else if (downs.length === 1) text = `${downs[0].short} is down`;
    else if (downs.length === 2) text = `${downs[0].short} and ${downs[1].short} are down`;
    else if (downs.length) text = `${downs.length} systems down: ${downs.map(d => d.short).join(', ')}`;
    b.style.display = text ? 'flex' : 'none';
    b.style.background = Math.floor(Date.now() / 600) % 2 ? '#d9493b' : '#a82e22';
    b.querySelector('span').textContent = text;
  }
  renderPanel() {
    const p = $('panel'), s = this.sys.find(x => x.id === this.ui.sel);
    if (!s) { p.style.display = 'none'; return; }
    p.style.display = 'flex';
    const statusText = { up: 'Online · grazing', slow: 'Sick · responding slowly', down: 'Fainted · not responding', maint: 'Asleep · maintenance', nourl: 'Asleep · no address', wait: 'Checking…' }[s.status];
    const max = Math.max(this.meta.slowMs * 1.5 || 2000, ...s.history.map(h => h.ms || 0));
    const bars = s.history.map(h => h.ok
      ? `<i title="${h.ms} ms" style="height:${Math.max(6, (h.ms / max) * 100)}%;background:${h.ms > this.meta.slowMs ? COL.slow : COL.up}"></i>`
      : `<i title="failed" style="height:100%;background:${COL.down}"></i>`).join('');
    const inc = this.incidents.filter(i => i.id === s.id).slice(0, 6);
    $('panelBody').innerHTML = `
      <div class="ph"><div><div class="sec">${SPECIES[s.species] || 'ANIMAL'}</div><h2>${esc(s.name)}</h2><p>${esc(s.desc)}</p></div><button class="x" id="pClose">×</button></div>
      <div class="badge" style="background:${COL[s.status]}">${statusText}${s.since && s.status !== 'wait' ? ' · ' + fmtDur(Date.now() - s.since) : ''}</div>
      ${s.error ? `<div class="err">${esc(s.error)}</div>` : ''}
      <div class="grid">
        <div class="tile"><span>RESPONSE</span><b>${s.latency != null ? s.latency + ' ms' : '—'}</b></div>
        <div class="tile"><span>HTTP CODE</span><b>${s.code ?? '—'}</b></div>
        <div class="tile"><span>UPTIME</span><b>${s.checks ? (s.ok / s.checks * 100).toFixed(s.ok === s.checks ? 0 : 1) + '%' : '—'}</b></div>
        <div class="tile"><span>LAST CHECK</span><b>${s.lastCheck ? fmtDur(Date.now() - s.lastCheck) + ' ago' : '—'}</b></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px"><div class="sec">LAST ${s.history.length} CHECKS</div>${s.history.length ? `<div class="spark">${bars}</div>` : '<div class="muted">No checks yet.</div>'}</div>
      <div style="display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700"><div class="sec">ADDRESS</div>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener" style="word-break:break-all">${esc(s.url)}</a>` : '<div class="muted">No address set.</div>'}</div>
      <div style="display:flex;flex-direction:column;gap:6px"><div class="sec">RECENT CHANGES</div>
        ${inc.length ? inc.map(i => `<div class="row"><span class="t">${fmtTime(i.t)}</span><span style="color:${COL[i.to] || 'inherit'}">${esc(this.incText(i))}</span></div>`).join('') : '<div class="muted">No changes recorded.</div>'}
      </div>`;
    $('pClose').onclick = () => this.select(null);
  }
  incText(i) {
    if (i.to === 'down') return 'went down' + (i.error ? ` — ${i.error}` : '');
    if (i.to === 'slow') return `slowed (${i.ms} ms)`;
    if (i.to === 'maint') return 'put to sleep (maintenance)';
    if (i.to === 'nourl') return 'address removed';
    return i.from === 'down' ? 'back online' : i.from === 'slow' ? `recovered (${i.ms} ms)` : 'online';
  }
  renderIncidents() {
    const box = $('inc');
    box.style.display = this.ui.showInc ? 'flex' : 'none';
    if (!this.ui.showInc) return;
    box.innerHTML = `<div class="ph"><div class="eyebrow">INCIDENT HISTORY</div><button class="small" id="iClear">Clear</button></div>` +
      (this.incidents.length ? this.incidents.slice(0, 80).map(i => `<div class="irow"><span class="t" style="color:var(--soft)">${fmtTime(i.t)}</span><span><b>${esc(i.name)}</b> <span style="color:${COL[i.to] || 'inherit'}">${esc(this.incText(i))}</span></span></div>`).join('')
        : '<div class="muted">Nothing yet. Changes appear here when a system goes down, slows or recovers.</div>');
    $('iClear').onclick = async () => {
      if (!confirm('Clear the incident history for everyone viewing this monitor?')) return;
      try { await fetch('api/incidents', { method: 'DELETE' }); this.incidents = []; this.renderUI(); } catch (e) {}
    };
  }
  buildLabels() {
    const box = $('labels'); box.innerHTML = ''; this.labelEls = {};
    this.sys.forEach(s => {
      const el = document.createElement('div'); el.className = 'lbl';
      el.innerHTML = `<span class="dot"></span><span>${esc(s.short)}</span><span class="tag"></span>`;
      el.onclick = () => this.select(s.id);
      box.appendChild(el); this.labelEls[s.id] = el;
    });
    this.renderUI();
  }
  select(id) {
    if (!id && this.ui.sel) { const a = this.animals[this.ui.sel]; if (a) { this.cs.tx = a.g.position.x; this.cs.tz = a.g.position.z; } }
    this.idle = 0; this.ui.sel = id; this.renderUI();
  }

  // ================= 3D SCENE =================
  initScene() {
    const T = this.T = THREE;
    const el = $('stage'), hi = QUALITY === 'high';
    let r;
    try { r = this.renderer = new T.WebGLRenderer({ antialias: hi, powerPreference: 'high-performance' }); }
    catch (e) { $('msg').firstElementChild.textContent = 'This browser cannot show 3D (WebGL is off). Statuses still update in the cards above.'; return; }
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, hi ? 2 : 1));
    r.shadowMap.enabled = true; r.shadowMap.type = hi ? T.PCFSoftShadowMap : T.PCFShadowMap;
    r.toneMapping = T.ACESFilmicToneMapping; r.outputColorSpace = T.SRGBColorSpace;
    r.domElement.style.display = 'block'; el.appendChild(r.domElement);
    this.scene = new T.Scene(); this.scene.fog = new T.Fog(0xbcd9e6, 80, 190);
    this.cam = new T.PerspectiveCamera(34, 1, 0.5, 600);
    this.mats = {}; this.rng = this.seeded(11);
    this.hemi = new T.HemisphereLight(0xd6ecff, 0x5d7a3c, 0.9); this.scene.add(this.hemi);
    const sun = this.sun = new T.DirectionalLight(0xfff0d8, 2.6);
    sun.castShadow = true; sun.shadow.mapSize.set(hi ? 2048 : 1024, hi ? 2048 : 1024);
    Object.assign(sun.shadow.camera, { left: -38, right: 38, top: 34, bottom: -34, near: 1, far: 200 });

        [-1, -0.33, 0.33, 1].forEach(f => { const z = f * o.len / 2; sph(rig, o.r, o.body, 0, by, z, 1, 1, 1, { r: 1 }); [-1, 1].forEach(s => sph(rig, o.r * 0.7, o.body, s * o.r * 0.55, by + 0.1, z + 0.08, 1, 1, 1, { r: 1 })); sph(rig, o.r * 0.65, o.body, 0, by + o.r * 0.55, z - 0.05, 1, 1, 1, { r: 1 }); });
      } else cap(rig, o.r, o.len, o.body, 0, by, 0, Math.PI / 2);
      pivotY = by - o.r * 0.35;
      const lx = o.r * 0.55, lz = o.len / 2 * 0.82;
      [[lx, lz, 0], [-lx, lz, Math.PI], [lx, -lz, Math.PI], [-lx, -lz, 0]].forEach(([x, z, ph]) => {
        const p = new T.Group(); p.position.set(x, pivotY, z); p.userData.ph = ph; rig.add(p);
        cap(p, o.legR, Math.max(0.02, pivotY - o.legR * 2), o.leg || o.body, 0, -pivotY / 2, 0);
        this.put(p, this.M(new T.CylinderGeometry(o.legR * 1.15, o.legR * 1.3, 0.14, 12), o.hoof), 0, -pivotY + 0.07, 0);
        legs.push(p);
      });
      hp = new T.Group(); hp.position.set(0, by + o.r * 0.3, o.len / 2 + o.r * 0.5); rig.add(hp);
      if (o.neckLen > 0.1) cap(hp, o.neckR, o.neckLen, o.body, 0, o.neckLen * 0.42, o.neckLen * 0.3, o.neckTilt);
      o.neck && o.neck(hp);
      const hc = new T.Group(); hc.position.set(0, o.neckLen * 0.85 + 0.05, o.neckLen * 0.55 + 0.06); hp.add(hc); o.head(hc);
      tp = new T.Group(); tp.position.set(0, by + o.r * 0.35, -o.len / 2 - o.r * 0.75); rig.add(tp); o.tail(tp);
      o.extra && o.extra(rig, by, o);
    }
    g.scale.setScalar(o.sc);
    const box = new T.Box3().setFromObject(g), size = box.getSize(new T.Vector3());
    return { g, rig, legs, headP: hp, tail: tp, by, r: o.r, legLen: pivotY, kind: o.bird ? 'bird' : (o.kind || 'quad'), top: box.max.y, foot: Math.max(size.x, size.z) / 2 * 0.85 + 0.35 };
  }

  // ================= CONTROLS =================
  setupControls() {
    const el = this.renderer.domElement, P = new Map(), cl = (v, a, b) => Math.max(a, Math.min(b, v));
    let down = null, pinch = null;
    el.addEventListener('pointerdown', e => {
      el.setPointerCapture(e.pointerId); P.set(e.pointerId, { x: e.clientX, y: e.clientY });
      down = { moved: 0, btn: e.button }; this.idle = 0; this.unlockAudio();
      if (P.size === 2) { const [a, b] = [...P.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
    });
    el.addEventListener('pointermove', e => {
      const p = P.get(e.pointerId); if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
      if (down) down.moved += Math.abs(dx) + Math.abs(dy);
      this.idle = 0;
      if (P.size === 2) { const [a, b] = [...P.values()], d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch) this.cs.zoom = cl(this.cs.zoom * pinch / d, 0.3, 1.7); pinch = d; return; }
      if ((down && down.btn === 2) || e.shiftKey) {
        const k = this.fitDist * this.cur.zoom * 0.0013, y = this.cs.yaw;
        this.cs.tx = cl(this.cs.tx - (Math.cos(y) * dx + Math.sin(y) * dy) * k, -30, 30);
        this.cs.tz = cl(this.cs.tz - (-Math.sin(y) * dx + Math.cos(y) * dy) * k, -30, 30);
      } else { this.cs.yaw -= dx * 0.006; this.cs.pitch = cl(this.cs.pitch + dy * 0.004, 0.15, 1.35); }
    });
    const up = e => {
      P.delete(e.pointerId); if (P.size < 2) pinch = null;
      if (down && down.moved < 6 && e.type === 'pointerup' && down.btn === 0) this.pick(e);
      if (!P.size) down = null;
    };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', e => { e.preventDefault(); this.cs.zoom = cl(this.cs.zoom * Math.exp(e.deltaY * 0.001), 0.3, 1.7); this.idle = 0; }, { passive: false });
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  pick(e) {
    const T = this.T, rc = this.renderer.domElement.getBoundingClientRect();
    const ray = new T.Raycaster(); ray.setFromCamera(new T.Vector2((e.clientX - rc.left) / rc.width * 2 - 1, -(e.clientY - rc.top) / rc.height * 2 + 1), this.cam);
    const hit = ray.intersectObjects(this.pickables, false)[0];
    this.select(hit ? hit.object.userData.id : null);
  }

  // ================= FRAME =================
  frame() {
    const dt = Math.min(0.05, this.clock.getDelta()), t = this.clock.elapsedTime, el = $('stage');
    if (el.clientWidth !== this.vw || el.clientHeight !== this.vh) this.resize();
    if (!this.vw || !this.vh) return;
    this.updateSky();
    this.clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 160) c.position.x = -160; });
    const blink = this.hasDown() ? (Math.sin(t * 9) > 0 ? 1 : 0.12) : 0;
    this.sirenMat.emissiveIntensity = blink * 4; this.siren.intensity = blink * 60;
    this.sys.forEach(s => { const a = this.animals[s.id]; if (a) this.animate(a, s, dt, t); });
    this.updateCamera(dt, t);
    this.renderer.render(this.scene, this.cam);
    this.updateLabels();
  }
  updateSky() {
    const T = this.T, now = new Date();
    let h = now.getHours() + now.getMinutes() / 60;
    if (TIME_MODE === 'day') h = 10.5; if (TIME_MODE === 'night') h = 22.5;
    const a = (h - 6) / 12 * Math.PI, el = Math.sin(a);
    const day = Math.min(1, Math.max(0, (el + 0.08) / 0.38)), dusk = el > -0.25 ? Math.max(0, 1 - Math.abs(el) / 0.3) : 0, night = 1 - day;
    this.sun.position.set(Math.cos(a) * 70, Math.max(el, 0.08) * 85 + 6, 40); this.sun.intensity = 2.8 * day;
    this.sun.color.set(0xfff0d8).lerp(new T.Color(0xffa060), dusk * 0.6);
    this.moon.position.set(-Math.cos(a) * 60, Math.max(-el, 0.25) * 80, 30); this.moon.intensity = 0.7 * night;
    this.moonMesh.position.set(-Math.cos(a) * 200, Math.max(-el, 0.15) * 200, -120); this.moonMesh.material.opacity = night;
    this.hemi.intensity = 0.3 + 0.7 * day; this.hemi.color.set(0x7d8fc4).lerp(new T.Color(0xd6ecff), day);
    const sky = new T.Color(0x0c1730).lerp(new T.Color(0x9fcfe8), day).lerp(new T.Color(0xf0a272), dusk * 0.5);
    this.scene.background = sky; this.scene.fog.color.copy(sky);
    this.renderer.toneMappingExposure = 0.95 + night * 0.35;
    this.winMat.emissiveIntensity = night * 1.8; this.lampMat.emissiveIntensity = night * 3; this.porch.intensity = night * 30;
    this.signMat.emissiveIntensity = 0.2 + night * 0.9; this.nameMat.emissiveIntensity = 0.1 + night * 0.7;
    this.lanterns.forEach(m => m.emissiveIntensity = night * 3);
    this.fan.rotation.z -= 0.02;
    this.stars.material.opacity = Math.max(0, night - 0.2);
    this.cloudMat.color.set(0xffffff).lerp(new T.Color(0x34405c), night); this.cloudMat.emissiveIntensity = 0.25 * day;
  }
  animate(a, s, dt, t) {
    const st = s.status, down = st === 'down', sleep = sleepy(st), slow = st === 'slow', g = a.g.position, rnd = this.rng;
    const k = Math.min(1, dt * 3);
    a.side += ((down ? 1 : 0) - a.side) * k; a.rest += ((sleep ? 1 : 0) - a.rest) * k;
    let moving = 0;
    if (!down && !sleep && a.side < 0.1 && a.rest < 0.1) {
      if (a.wait > 0) a.wait -= dt;
      else {
        if (!a.target) { const an = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * a.rad; a.target = [a.home.x + Math.cos(an) * d, a.home.z + Math.sin(an) * d]; }
        const dx = a.target[0] - g.x, dz = a.target[1] - g.z, dist = Math.hypot(dx, dz);
        if (dist < 0.2) { a.target = null; a.wait = (1.5 + rnd() * 4.5) * (slow ? 2.2 : 1); }
        else {
          let dy = Math.atan2(dx, dz) - a.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
          a.yaw += dy * Math.min(1, dt * 4);
          const sp = (slow ? 0.45 : 1.3) * (a.kind === 'bird' ? 0.8 : 1), f = Math.abs(dy) < 1.2 ? 1 : 0.15;
          g.x += Math.sin(a.yaw) * sp * dt * f; g.z += Math.cos(a.yaw) * sp * dt * f;
          moving = 1; a.walk += dt * sp * (a.kind === 'bird' ? 10 : a.kind === 'hop' ? 7 : 5.5);
        }
      }
    }
    a.mv += (moving - a.mv) * Math.min(1, dt * 6);
    a.legs.forEach(p => { p.rotation.x = Math.sin(a.walk + p.userData.ph) * 0.6 * a.mv; p.scale.y = 1 - a.rest * 0.75; });
    const R = a.rig;
    let y = a.kind === 'hop' ? Math.abs(Math.sin(a.walk * 0.5)) * 0.35 * a.mv : Math.abs(Math.sin(a.walk)) * 0.04 * a.mv;
    y -= a.rest * a.legLen * 0.75;
    R.rotation.z = a.side * 1.5;
    R.position.set(a.side * a.by * 0.55, y + a.side * (a.r - a.by * 0.07), 0);
    R.rotation.x = slow ? Math.sin(t * 1.6 + a.seed) * 0.06 : 0;
    let ht = 0;
    if (down) ht = 0.15; else if (sleep) ht = 0.45; else if (slow) ht = 0.55;
    else if (a.wait > 0) ht = a.kind === 'bird' ? (Math.sin(t * 5 + a.seed) > 0.55 ? 1 : 0.1) : a.kind === 'hop' ? 0.2 : 0.85;
    a.head += (ht - a.head) * Math.min(1, dt * (a.kind === 'bird' ? 10 : 3));
    a.headP.rotation.x = a.head;
    a.tail.rotation.y = Math.sin(t * (slow ? 1.5 : 4) + a.seed) * 0.35 * (1 - a.side);
    a.g.rotation.y = a.yaw;
    const isSel = this.ui.sel === s.id, pulse = down ? 1 + Math.sin(t * 7) * 0.12 : 1;
    a.ring.position.set(g.x, 0.04, g.z); a.ring.scale.setScalar(a.foot * pulse * (isSel ? 1.25 : 1));
    a.ring.material.color.set(isSel ? '#ffffff' : COL[st]);
    a.ring.material.opacity = down ? 0.55 + Math.abs(Math.sin(t * 7)) * 0.4 : 0.85;
    a.zz.visible = a.rest > 0.5;
    if (a.zz.visible) { const ph = (t * 0.45 + a.seed) % 1; a.zz.position.set(g.x + 0.5, a.top * 0.55 + ph * 1.1, g.z); a.zz.material.opacity = 1 - ph; }
  }
  updateCamera(dt, t) {
    const cs = this.cs, cur = this.cur, sel = this.ui.sel && this.animals[this.ui.sel];
    this.idle += dt;
    let tx = cs.tx, tz = cs.tz, zoom = cs.zoom;
    if (sel) { tx = sel.g.position.x; tz = sel.g.position.z; zoom = Math.min(cs.zoom, 0.5); }
    else if (AUTO_SWAY && this.idle > 30) {
      const e = Math.min(1, dt * 0.3);
      cs.tx += (0 - cs.tx) * e; cs.tz += (-1.5 - cs.tz) * e; cs.zoom += (1 - cs.zoom) * e; cs.pitch += (0.62 - cs.pitch) * e;
      cs.yaw = Math.atan2(Math.sin(cs.yaw), Math.cos(cs.yaw)); cur.yaw = cs.yaw + Math.atan2(Math.sin(cur.yaw - cs.yaw), Math.cos(cur.yaw - cs.yaw));
      cs.yaw += (Math.sin(t * 0.05) * 0.5 - cs.yaw) * Math.min(1, dt * 0.15);
    }
    const e = Math.min(1, dt * 4);
    cur.tx += (tx - cur.tx) * e; cur.tz += (tz - cur.tz) * e; cur.zoom += (zoom - cur.zoom) * e;
    cur.yaw += (cs.yaw - cur.yaw) * Math.min(1, dt * 8); cur.pitch += (cs.pitch - cur.pitch) * Math.min(1, dt * 8);
    const d = (this.fitDist || 50) * cur.zoom;
    this.cam.position.set(cur.tx + d * Math.cos(cur.pitch) * Math.sin(cur.yaw), d * Math.sin(cur.pitch), cur.tz + d * Math.cos(cur.pitch) * Math.cos(cur.yaw));
    this.cam.lookAt(cur.tx, 0.8, cur.tz);
  }
  updateLabels() {
    const v = this.lv || (this.lv = new this.T.Vector3()), w = this.vw, h = this.vh;
    for (const id in this.labelEls) {
      const el = this.labelEls[id], a = this.animals[id]; if (!a) continue;
      v.set(a.g.position.x, a.top * (1 - a.side * 0.6) * (1 - a.rest * 0.3) + 0.4, a.g.position.z).project(this.cam);
      if (v.z > 1 || v.z < -1) { el.style.transform = 'translate(-9999px,0)'; continue; }
      const x = Math.max(50, Math.min(w - 50, (v.x * 0.5 + 0.5) * w)), y = (-v.y * 0.5 + 0.5) * h;
      el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)`;
    }
  }
}

window.farm = new Farm();
</script>
